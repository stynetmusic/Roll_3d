name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8 x86
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86

      - name: Install
        run: |
          python -c "import struct, sys; print(sys.version); bits = struct.calcsize('P') * 8; print(bits); assert bits == 32"
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==5.13.2

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --windowed --name Roll_3d --add-data "web;web" Roll_3d.py

      - name: Upload Roll_3d-windows-x86
        uses: actions/upload-artifact@v4
        with:
          name: Roll_3d-windows-x86
          path: dist/Roll_3d
